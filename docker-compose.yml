services:
  db:
    image: postgres:14-alpine
    container_name: minirestoo_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=minirestoo_user
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=minirestoo_db
    ports:
      - "5432:5432" 
    volumes:
      - minirestoo_db_data:/var/lib/postgresql/data
    networks:
      - minirestoo_network

  nginx:
    build:
      context: ./nginx
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - minirestoo_network
    depends_on:
      - product-management
      - inventory-management
      - operasional

  product-management:
    build:
      context: ./product-management
    container_name: product_service
    restart: unless-stopped
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://minirestoo_user:secretpassword@db:5432/minirestoo_db
    networks:
      - minirestoo_network
    depends_on:
      - db

  inventory-management:
    build:
      context: ./inventory-management
    container_name: inventory_service
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://minirestoo_user:secretpassword@db:5432/minirestoo_db
    networks:
      - minirestoo_network
    depends_on:
      - db

  operasional:
    build:
      context: ./operasional
    container_name: operasional_service
    restart: unless-stopped
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://minirestoo_user:secretpassword@db:5432/minirestoo_db
      - PRODUCT_SERVICE_URL=http://product-management:3002
      - INVENTORY_SERVICE_URL=http://inventory-management:3001
    networks:
      - minirestoo_network
    depends_on:
      - db
      - product-management
      - inventory-management

  frontend:
    build:
      context: ./frontend
    container_name: frontend_app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - minirestoo_network

networks:
  minirestoo_network:
    driver: bridge

volumes:
  minirestoo_db_data: