
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:

  REACT_APP_API_URL: "http://backend-service:5000"
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
spec:
  replicas: 2         
  selector:
    matchLabels:
      app: frontend   
  template:
    metadata:
      labels:
        app: frontend  
    spec:
      containers:
      - name: frontend-app
        image: minirestoo-frontend:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: frontend-config     
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort 
  selector:
    app: frontend
  ports:
    - port: 80          
      targetPort: 80  
      nodePort: 30001   