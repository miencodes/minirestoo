apiVersion: v1
kind: Service
metadata:
  name: db-service 
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
  clusterIP: None 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13
        env:
        - name: POSTGRES_USER
          value: "minirestoo_user"
        - name: POSTGRES_PASSWORD
          value: "secretpassword"
        - name: POSTGRES_DB
          value: "minirestoo_db"
        ports:
        - containerPort: 5432