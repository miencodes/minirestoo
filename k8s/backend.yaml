apiVersion: v1
kind: Service
metadata:
  name: inventory-management
spec:
  selector:
    app: inventory
  ports:
    - port: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: inventory
        image: local/inventory
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: product-management
spec:
  selector:
    app: product
  ports:
    - port: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
      - name: product
        image: local/product
        imagePullPolicy: Never
        ports:
        - containerPort: 3002
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: operasional
spec:
  selector:
    app: operasional
  ports:
    - port: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operasional
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operasional
  template:
    metadata:
      labels:
        app: operasional
    spec:
      containers:
      - name: operasional
        image: local/operasional
        imagePullPolicy: Never
        ports:
        - containerPort: 3003
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-url
        - name: PRODUCT_SERVICE_URL
          value: "http://product-management:3002"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-management:3001"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: local/nginx
        imagePullPolicy: Never
        ports:
        - containerPort: 80